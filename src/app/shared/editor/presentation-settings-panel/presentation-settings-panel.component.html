<div class="presentation-settings">
  <div class="preset-row">
    @for (p of ladder; track p) {
      <button
        type="button"
        class="preset-btn"
        [class.active]="isActive(editor.qualitySettings().presentationPreset, p)"
        (click)="setPresentation(p)"
      >
        {{ p }}
      </button>
    }
    <button
      type="button"
      class="preset-btn preset-custom"
      [class.active]="editor.qualitySettings().presentationPreset === 'custom'"
      disabled
      [attr.title]="l10n.t(customHintKey())"
      [attr.aria-pressed]="editor.qualitySettings().presentationPreset === 'custom'"
    >
      {{ presetLabel('custom') }}
    </button>
  </div>
  <label class="check">
    <input
      type="checkbox"
      [checked]="editor.antiAliasing()"
      (change)="editor.setAntiAliasing($any($event.target).checked)"
    />
    {{ l10n.t('antiAliasing') }}
  </label>
  <label class="check">
    <input
      type="checkbox"
      [checked]="editor.theatricalGlow()"
      (change)="editor.setTheatricalGlow($any($event.target).checked)"
    />
    {{ l10n.t('theatricalGlow') }}
  </label>
  <label>
    {{ l10n.t('colorProfile') }}
    <select
      [value]="editor.qualitySettings().colorProfile"
      (change)="onColorProfile($any($event.target).value)"
    >
      <option value="hdr">{{ l10n.t('colorProfileHdr') }}</option>
      <option value="sdr">{{ l10n.t('colorProfileSdr') }}</option>
    </select>
  </label>
  <p class="hint">{{ l10n.t('hintColorProfile') }}</p>
  <label>
    {{ l10n.t('outputGamma') }}
    <input
      type="number"
      min="1"
      max="3"
      step="0.1"
      [value]="editor.qualitySettings().outputGamma"
      (change)="onOutputGamma($any($event.target).value)"
    />
  </label>
  <div class="preset-row">
    <button
      type="button"
      class="preset-btn"
      [class.active]="editor.qualitySettings().outputGamma === 2.2"
      (click)="onOutputGamma('2.2')"
    >
      2.2
    </button>
    <button
      type="button"
      class="preset-btn"
      [class.active]="editor.qualitySettings().outputGamma === 2.4"
      (click)="onOutputGamma('2.4')"
    >
      2.4
    </button>
  </div>
  <p class="hint">{{ l10n.t('hintOutputGamma') }}</p>
  <label>
    {{ l10n.t('tonemapMode') }}
    <select
      [value]="editor.tonemapMode()"
      (change)="onTonemap($any($event.target).value)"
    >
      <option value="aces">ACES</option>
      <option value="reinhard">Reinhard</option>
      <option value="hable">Hable</option>
    </select>
  </label>
  <p class="hint">{{ l10n.t('hintTonemapMode') }}</p>
</div>
