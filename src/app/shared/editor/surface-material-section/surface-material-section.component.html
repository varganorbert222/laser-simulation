<section class="block">
  <h3>{{ l10n.t('surfaceMaterial') }}</h3>

  <label [attr.title]="l10n.t('tipFixtureFinish')">
    {{ l10n.t('fixtureFinish') }}
    <select
      [value]="material().preset"
      [disabled]="!editor.isEditMode()"
      (change)="onFinishPreset($any($event.target).value)"
    >
      @for (p of finishPresets; track p) {
        <option [value]="p">{{ finishLabel(p) }}</option>
      }
      <option value="custom">{{ l10n.t('finishCustom') }}</option>
    </select>
  </label>
  <label [attr.title]="l10n.t('tipAlbedo')">
    {{ l10n.t('albedo') }}
    <input
      type="range"
      min="0"
      max="1"
      step="0.01"
      [value]="material().albedo"
      [disabled]="!editor.isEditMode()"
      (input)="onSurfaceParam('albedo', $any($event.target).value)"
    />
    <span class="value">{{ material().albedo | number: '1.2-2' }}</span>
  </label>
  <label [attr.title]="l10n.t('tipMetalness')">
    {{ l10n.t('metalness') }}
    <input
      type="range"
      min="0"
      max="1"
      step="0.01"
      [value]="material().metalness"
      [disabled]="!editor.isEditMode()"
      (input)="onSurfaceParam('metalness', $any($event.target).value)"
    />
    <span class="value">{{ material().metalness | number: '1.2-2' }}</span>
  </label>
  <label [attr.title]="l10n.t('tipRoughness')">
    {{ l10n.t('roughness') }}
    <input
      type="range"
      min="0"
      max="1"
      step="0.01"
      [value]="material().roughness"
      [disabled]="!editor.isEditMode()"
      (input)="onSurfaceParam('roughness', $any($event.target).value)"
    />
    <span class="value">{{ material().roughness | number: '1.2-2' }}</span>
  </label>
  <label [attr.title]="l10n.t('tipTransmission')">
    {{ l10n.t('transmission') }}
    <input
      type="range"
      min="0"
      max="1"
      step="0.01"
      [value]="material().transmission"
      [disabled]="!editor.isEditMode()"
      (input)="onSurfaceParam('transmission', $any($event.target).value)"
    />
    <span class="value">{{ material().transmission | number: '1.2-2' }}</span>
  </label>
  <p class="hint">{{ l10n.t('hintSurfaceMaterial') }}</p>
  <p class="hint">{{ l10n.t('hintTransmission') }}</p>
</section>
