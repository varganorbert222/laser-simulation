<section class="block">
  <h3>{{ i18n.t('smokeEmitter') }}</h3>
  <p class="hint">{{ i18n.t('hintSmokeEmitter') }}</p>
  <label class="check" [attr.title]="i18n.t('tipSmokeEnabled')">
    <input
      type="checkbox"
      [checked]="smoke().enabled"
      [disabled]="!editor.isEditMode()"
      (change)="onEnabled($any($event.target).checked)"
    />
    {{ i18n.t('smokeEnabled') }}
  </label>
  <label [attr.title]="i18n.t('tipSmokeEmission')">
    {{ i18n.t('smokeEmission') }}
    <input
      type="range"
      [min]="emissionMin"
      [max]="emissionMax"
      step="0.05"
      [value]="smoke().emissionRate"
      [disabled]="!editor.isEditMode() || !smoke().enabled"
      (input)="onEmission($any($event.target).value)"
    />
    <span class="value">{{ smoke().emissionRate | number: '1.2-2' }}</span>
  </label>
  <label [attr.title]="i18n.t('tipSmokeCone')">
    {{ i18n.t('smokeCone') }}
    <input
      type="range"
      [min]="coneMin"
      [max]="coneMax"
      step="1"
      [value]="smoke().coneAngleDeg"
      [disabled]="!editor.isEditMode() || !smoke().enabled"
      (input)="onCone($any($event.target).value)"
    />
    <span class="value">{{ smoke().coneAngleDeg | number: '1.0-0' }}°</span>
  </label>
  <label [attr.title]="i18n.t('tipSmokePlumeLength')">
    {{ i18n.t('smokePlumeLength') }}
    <input
      type="range"
      [min]="lengthMin"
      [max]="lengthMax"
      step="0.1"
      [value]="smoke().plumeLengthM"
      [disabled]="!editor.isEditMode() || !smoke().enabled"
      (input)="onPlumeLength($any($event.target).value)"
    />
    <span class="value">{{ smoke().plumeLengthM | number: '1.1-1' }} m</span>
  </label>
</section>
