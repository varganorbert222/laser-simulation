<section class="block">
  <h3>MediaVolume</h3>
  <label>
    {{ i18n.t('mediaKind') }}
    <select
      [value]="media().kind"
      [disabled]="!editor.isEditMode()"
      (change)="onMediaKind($any($event.target).value)"
    >
      @for (k of mediaKinds; track k) {
        <option [value]="k">{{ k }}</option>
      }
    </select>
  </label>
  <label>
    {{ i18n.t('fogDensity') }}
    <input
      type="range"
      min="0"
      max="1.5"
      step="0.01"
      [value]="media().density"
      [disabled]="!editor.isEditMode()"
      (input)="onDensity($any($event.target).value)"
    />
    <span class="value">{{ media().density | number: '1.2-2' }}</span>
  </label>

  <app-color-field
    [label]="i18n.t('mediaColor')"
    [rgb]="media().color"
    [readonly]="!editor.isEditMode()"
    (rgbChange)="onMediaColor($event)"
  />

  <h4 class="subhead">{{ i18n.t('boundingBox') }}</h4>
  <app-vec3-field
    [label]="i18n.t('halfExtents')"
    [value]="halfExtentsVec()"
    [readonly]="!editor.isEditMode()"
    [step]="0.05"
    [decimals]="2"
    (valueChange)="onHalfExtents($event)"
  />

  <h4 class="subhead">{{ i18n.t('noiseParams') }}</h4>
  <label>
    {{ i18n.t('fbmScale') }}
    <input
      type="range"
      min="0.05"
      max="3"
      step="0.01"
      [value]="media().fbmScale"
      [disabled]="!editor.isEditMode()"
      (input)="onMediaNumber('fbmScale', $any($event.target).value)"
    />
    <span class="value">{{ media().fbmScale | number: '1.2-2' }}</span>
  </label>
  <label>
    {{ i18n.t('fbmTimeScale') }}
    <input
      type="range"
      min="0"
      max="2"
      step="0.01"
      [value]="media().fbmTimeScale"
      [disabled]="!editor.isEditMode()"
      (input)="onMediaNumber('fbmTimeScale', $any($event.target).value)"
    />
    <span class="value">{{ media().fbmTimeScale | number: '1.2-2' }}</span>
  </label>
  <label>
    {{ i18n.t('noiseLow') }}
    <input
      type="range"
      min="0"
      max="1"
      step="0.01"
      [value]="media().noiseThresholdLow"
      [disabled]="!editor.isEditMode()"
      (input)="onMediaNumber('noiseThresholdLow', $any($event.target).value)"
    />
    <span class="value">{{ media().noiseThresholdLow | number: '1.2-2' }}</span>
  </label>
  <label>
    {{ i18n.t('noiseHigh') }}
    <input
      type="range"
      min="0"
      max="1"
      step="0.01"
      [value]="media().noiseThresholdHigh"
      [disabled]="!editor.isEditMode()"
      (input)="onMediaNumber('noiseThresholdHigh', $any($event.target).value)"
    />
    <span class="value">{{ media().noiseThresholdHigh | number: '1.2-2' }}</span>
  </label>

  <h4 class="subhead">{{ i18n.t('opticalParams') }}</h4>
  <label>
    {{ i18n.t('scatterModel') }}
    <select
      [value]="media().scatterModel"
      [disabled]="!editor.isEditMode()"
      (change)="onScatterModel($any($event.target).value)"
    >
      @for (m of scatterModels; track m) {
        <option [value]="m">{{ scatterModelLabel(m) }}</option>
      }
    </select>
  </label>
  <label>
    {{ i18n.t('particleSizeNm') }}
    <input
      type="range"
      min="0.1"
      max="1000"
      step="0.1"
      [value]="media().particleSizeNm"
      [disabled]="!editor.isEditMode()"
      (input)="onParticleSize($any($event.target).value)"
    />
    <span class="value">{{ media().particleSizeNm | number: '1.0-1' }} nm</span>
  </label>
  <label>
    {{ i18n.t('mieAnisotropy') }}
    <input
      type="range"
      min="-0.95"
      max="0.95"
      step="0.01"
      [value]="media().mieAnisotropy"
      [disabled]="!editor.isEditMode()"
      (input)="onMieAnisotropy($any($event.target).value)"
    />
    <span class="value">{{ media().mieAnisotropy | number: '1.2-2' }}</span>
  </label>
  <label>
    {{ i18n.t('scatter') }}
    <input
      type="range"
      min="0"
      max="2"
      step="0.01"
      [value]="media().scatter"
      [disabled]="!editor.isEditMode()"
      (input)="onMediaNumber('scatter', $any($event.target).value)"
    />
    <span class="value">{{ media().scatter | number: '1.2-2' }}</span>
  </label>
  <label>
    {{ i18n.t('absorption') }}
    <input
      type="range"
      min="0"
      max="2"
      step="0.01"
      [value]="media().absorption"
      [disabled]="!editor.isEditMode()"
      (input)="onMediaNumber('absorption', $any($event.target).value)"
    />
    <span class="value">{{ media().absorption | number: '1.2-2' }}</span>
  </label>
  <p class="hint">{{ i18n.t('hintScatterModel') }}</p>
  <p class="hint">{{ i18n.t('hintMieAnisotropy') }}</p>
  <p class="hint">{{ i18n.t('hintFog') }}</p>
</section>
