<section class="transform-inspector">
  <div class="head">
    <h3>Transform</h3>
    @if (showGizmo && !readonly) {
      <div class="gizmo-toolbar">
        <div class="gizmo-modes">
          <button
            type="button"
            [class.active]="gizmoMode === 'position'"
            [attr.title]="l10n.t('tipPosition')"
            (click)="gizmoModeChange.emit('position')"
          >
            Move
          </button>
          <button
            type="button"
            [class.active]="gizmoMode === 'rotation'"
            [attr.title]="l10n.t('tipRotation')"
            (click)="gizmoModeChange.emit('rotation')"
          >
            Rotate
          </button>
          <button
            type="button"
            [class.active]="gizmoMode === 'scale'"
            [attr.title]="l10n.t('tipScale')"
            (click)="gizmoModeChange.emit('scale')"
          >
            Scale
          </button>
        </div>
        <div class="gizmo-space" role="group" [attr.aria-label]="l10n.t('tipGizmoSpace')">
          <button
            type="button"
            [class.active]="gizmoSpace === 'world'"
            [attr.title]="l10n.t('tipGizmoWorld')"
            (click)="gizmoSpaceChange.emit('world')"
          >
            World
          </button>
          <button
            type="button"
            [class.active]="gizmoSpace === 'local'"
            [attr.title]="l10n.t('tipGizmoLocal')"
            (click)="gizmoSpaceChange.emit('local')"
          >
            Local
          </button>
        </div>
      </div>
    }
  </div>
  <p class="hint">Helyi pozíció, Euler forgatás (°), skála — szülőhöz képest.</p>
  <app-vec3-field
    label="Position (m)"
    [tooltip]="l10n.t('tipPosition')"
    [value]="position"
    [readonly]="readonly || positionMixed"
    [step]="0.1"
    [decimals]="3"
    (editStart)="editStart.emit()"
    (valueChange)="positionChange.emit($event)"
  />
  <app-vec3-field
    label="Rotation Euler (°)"
    [tooltip]="l10n.t('tipRotation')"
    [value]="rotationDeg"
    [readonly]="readonly || rotationMixed"
    [step]="1"
    [decimals]="2"
    [axes]="['X', 'Y', 'Z']"
    (editStart)="editStart.emit()"
    (valueChange)="rotationChange.emit($event)"
  />
  <app-vec3-field
    label="Scale"
    [tooltip]="l10n.t('tipScale')"
    [value]="scale"
    [readonly]="readonly || scaleMixed"
    [step]="0.05"
    [decimals]="3"
    (editStart)="editStart.emit()"
    (valueChange)="scaleChange.emit($event)"
  />
</section>
